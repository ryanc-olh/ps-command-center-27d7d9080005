<script>
(function(){
  var ITER=250000, KEY='psdash_pw_v1';
  var E=document.getElementById('e'), F=document.getElementById('f'), PW=document.getElementById('pw'), GO=document.getElementById('go');
  // WebCrypto only exists in a secure context. Opening this file over file:// silently has no
  // crypto.subtle, which would otherwise look like "wrong password" forever.
  if(!(window.crypto&&window.crypto.subtle)){ E.textContent='Needs https — open the hosted link, not a local copy.'; GO.disabled=true; return; }
  var raw=document.getElementById('ct').textContent.trim();
  function b64(s){ var b=atob(s), a=new Uint8Array(b.length); for(var i=0;i<b.length;i++)a[i]=b.charCodeAt(i); return a; }
  var blob=JSON.parse(atob(raw)), salt=b64(blob.s), iv=b64(blob.i), ct=b64(blob.c);
  async function unlock(pw, quiet){
    try{
      var km=await crypto.subtle.importKey('raw', new TextEncoder().encode(pw), 'PBKDF2', false, ['deriveKey']);
      var key=await crypto.subtle.deriveKey({name:'PBKDF2',salt:salt,iterations:ITER,hash:'SHA-256'},
                km, {name:'AES-GCM',length:256}, false, ['decrypt']);
      var pt=await crypto.subtle.decrypt({name:'AES-GCM',iv:iv}, key, ct);   // GCM: wrong key throws, never garbage
      var html=new TextDecoder().decode(pt);
      if(document.getElementById('rem').checked) try{ localStorage.setItem(KEY,pw); }catch(_){}
      document.open(); document.write(html); document.close();               // scripts in the payload run
    }catch(err){
      try{ localStorage.removeItem(KEY); }catch(_){}
      if(!quiet){ E.textContent='Wrong passphrase.'; PW.value=''; PW.focus(); }
      GO.disabled=false; GO.textContent='Unlock';
    }
  }
  F.addEventListener('submit', function(ev){
    ev.preventDefault(); E.textContent=''; GO.disabled=true; GO.textContent='Unlocking\u2026';
    setTimeout(function(){ unlock(PW.value, false); }, 10);   // let the button repaint before the ~0.5s KDF
