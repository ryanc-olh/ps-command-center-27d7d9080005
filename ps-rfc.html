      var pt=await crypto.subtle.decrypt({name:'AES-GCM',iv:iv}, key, ct);   // GCM: wrong key throws, never garbage
      var html=new TextDecoder().decode(pt);
      if(document.getElementById('rem').checked) try{ localStorage.setItem(KEY,pw); }catch(_){}
      document.open(); document.write(html); document.close();               // scripts in the payload run
    }catch(err){
      try{ localStorage.removeItem(KEY); }catch(_){}
      if(!quiet){ E.textContent='Wrong passphrase.'; PW.value=''; PW.focus(); }
      GO.disabled=false; GO.textContent='Unlock';
    }
  }
  F.addEventListener('submit', function(ev){
    ev.preventDefault(); E.textContent=''; GO.disabled=true; GO.textContent='Unlocking\u2026';
    setTimeout(function(){ unlock(PW.value, false); }, 10);   // let the button repaint before the ~0.5s KDF
  });
  var saved=null; try{ saved=localStorage.getItem(KEY); }catch(_){}
  if(saved){ GO.disabled=true; GO.textContent='Unlocking\u2026'; setTimeout(function(){ unlock(saved, true); }, 10); }
})();
</script>
